# H2 in-memory database for integration tests
spring.datasource.url=jdbc:h2:mem:toothfairy_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable schema.sql / data.sql execution — Hibernate creates the schema from entities
spring.sql.init.mode=never

# JWT — same secret as production so tokens generated in tests are valid
jwt.secret=toothfairy_secret_key_very_long_string_minimum_256_bits_required
jwt.expiration=604800000

# Stub external keys — no real calls in tests (Stripe/Vision are @MockBean'd)
stripe.secret-key=sk_test_fake_integration
stripe.publishable-key=pk_test_fake_integration
google.vision.api.key=fake_vision_key_integration
